apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: homework
data:
  default.conf: |
    server {
        listen 8000;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Эндпоинт для метрик nginx
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }