apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-monitored
  namespace: homework
  labels:
    app: nginx-monitored
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-monitored
  template:
    metadata:
      labels:
        app: nginx-monitored
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
        - -nginx.scrape-uri=http://127.0.0.1:8000/nginx_status
        ports:
        - containerPort: 9113
          name: metrics
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config