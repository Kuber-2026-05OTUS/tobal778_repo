- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_check

- name: Initialize Kubernetes cluster
  command: kubeadm init --pod-network-cidr={{ pod_network_cidr }} --apiserver-advertise-address={{ ansible_host }}
  when: not kubeadm_init_check.stat.exists

- name: Create .kube directory for root
  file:
    path: ~/.kube
    state: directory
    mode: '0755'

- name: Copy admin.conf to root kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: ~/.kube/config
    remote_src: true
    mode: '0600'

- name: Create .kube directory for non-root user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf to non-root user kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Generate join command for workers
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join command to file on control host
  local_action: copy content="{{ join_command.stdout }}" dest=/tmp/k8s_join_command.txt mode=0600
  become: false
  run_once: true