apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "my-app.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "my-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      nodeSelector:
        homework: "true"   # можно тоже параметризовать, но пока оставим
      initContainers:
      {{- if .Values.initContainers.downloader.enabled }}
      - name: init-downloader
        image: {{ .Values.initContainers.downloader.image }}
        command:
        - sh
        - -c
        - wget -O /init/index.html {{ .Values.initContainers.downloader.url }} || echo "<html><body>Error get content</body></html>" > /init/index.html
        volumeMounts:
        - name: shared-volume
          mountPath: /init
      {{- end }}
      {{- if .Values.initContainers.metricsFetcher.enabled }}
      - name: metrics-fetcher
        image: {{ .Values.initContainers.metricsFetcher.image }}
        command:
        - sh
        - -c
        - |
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          curl -k -H "Authorization: Bearer $TOKEN" https://kubernetes.default.svc/metrics > /homework/metrics.html
        volumeMounts:
        - name: shared-volume
          mountPath: /homework
        securityContext:
          runAsUser: 0
      {{- end }}
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        command:
        - /bin/sh
        - -c
        - |
          echo 'server { listen {{ .Values.service.targetPort }}; root /homework; }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
        volumeMounts:
        - name: shared-volume
          mountPath: /homework
        - name: config-volume
          mountPath: /homework/conf
        {{- if .Values.probes.enabled }}
        readinessProbe:
          httpGet:
            path: /index.html
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        livenessProbe:
          httpGet:
            path: /index.html
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        {{- end }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "rm -f /homework/index.html"]
      volumes:
      - name: shared-volume
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "my-app.fullname" . }}-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: config-volume
        configMap:
          name: {{ include "my-app.fullname" . }}-config