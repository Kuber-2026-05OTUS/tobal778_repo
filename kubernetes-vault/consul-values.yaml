global:
  name: consul
  enableGateway: false

server:
  replicas: 3
  storage: 10Gi
  storageClass: "yc-network-hdd"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  config: |
    {
      "bind_addr": "{{ GetPrivateIP }}",
      "client_addr": "{{ GetPrivateIP }}",
      "advertise_addr": "{{ GetPrivateIP }}",
      "ports": {
        "http": 8500
      }
    }

client:
  enabled: true