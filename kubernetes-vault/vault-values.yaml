injector:
  enabled: false

server:
  serviceAccount:
    create: true
    name: vault

  service:
    type: ClusterIP

  dataStorage:
    enabled: false

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3

    config: |
      ui = true
      disable_mlock = true

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = true
      }

      storage "consul" {
        path = "vault/"
        address = "consul-server.consul.svc.cluster.local:8500"
      }

      service_registration "kubernetes" {}